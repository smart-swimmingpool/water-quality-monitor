---
###########################
###########################
## Linter GitHub Actions ##
###########################
###########################
name: Lint Code Base

#
# Documentation:
# https://help.github.com/en/articles/workflow-syntax-for-github-actions
#

#############################
# Start the job on all push #
#############################
on:
  push:
    branches-ignore:
      - "main"
      - "master"
  pull_request:

# Cancel in-progress runs for the same workflow+ref when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

###############
# Set the Job #
###############
jobs:
  super-linter:
    name: Super-Linter
    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Super-Linter
        uses: super-linter/super-linter@v8.7.0
        env:
          VALIDATE_ALL_CODEBASE: false

          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # PlatformIO Project Optimizations
          # Exclude build artifacts, dependencies, source files, and markdown files
          FILTER_REGEX_EXCLUDE: '.*/(\.pio|\.vscode|\.platformio|build|lib|src)/.*|.*\.md$'

          # Enable only relevant linters for PlatformIO project
          # When using selective validation, all other linters are disabled automatically
          # Note: VALIDATE_CLANG_FORMAT not listed - disabled due to version incompatibility
          # Note: CPP and Markdown files excluded via FILTER_REGEX_EXCLUDE due to style issues
          # cpplint (via VALIDATE_CPP) provides C++ style checking instead
          VALIDATE_CPP: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true

          # C/C++ specific settings
          CPP_FILE_EXTENSIONS: "cpp,hpp,h"

          # Markdown specific settings - increase line length to 150
          MARKDOWN_LINT_LINE_LENGTH: 150
          MARKDOWNLINT_LINE_LENGTH: 150
          # Disable MD051 and MD034 rules as they're too strict
          MARKDOWNLINT_RULES: "MD051=false,MD034=false"

          # Don't treat warnings as errors
          WARNINGS_AS_ERRORS: false

          # Logging
          LOG_LEVEL: NOTICE
